<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 自動框選與精準裁切</title>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();" type="text/javascript"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: sans-serif; }
        #camera-container { position: relative; flex: 1; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
        #process-canvas { display: none; }
        #photo-canvas { display: none; }
        
        .controls { height: 120px; background-color: #111; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        #capture-btn { width: 70px; height: 70px; border-radius: 50%; background-color: transparent; border: 5px solid #fff; position: relative; cursor: pointer; }
        #capture-btn::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 55px; height: 55px; background-color: #fff; border-radius: 50%; }
        #capture-btn:disabled { opacity: 0.3; }
        .btn { padding: 10px 20px; background-color: #333; color: #fff; border: none; border-radius: 20px; font-size: 14px; }
        
        #status-text { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 10; display: none; }
        
        #preview-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        #preview-modal img { max-width: 90%; max-height: 70%; border-radius: 8px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .modal-btns { margin-top: 20px; display: flex; gap: 15px; }
        .modal-btns button { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; }
        #save-btn { background: #4CAF50; color: white; }
        #close-preview { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div id="camera-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="status-text">正在加載 AI 引擎...</div>
    </div>

    <div class="controls">
        <button id="start-btn" class="btn">開啟相機</button>
        <button id="capture-btn" disabled></button>
        <div style="width: 80px;"></div>
    </div>

    <canvas id="process-canvas"></canvas>
    <canvas id="photo-canvas"></canvas>

    <div id="preview-modal">
        <img id="preview-img" src="">
        <div class="modal-btns">
            <button id="save-btn">保存照片</button>
            <button id="close-preview">關閉</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const captureBtn = document.getElementById('capture-btn');
        const statusText = document.getElementById('status-text');
        const processCanvas = document.getElementById('process-canvas');
        const photoCanvas = document.getElementById('photo-canvas');

        let isCameraOn = false;
        let isCvReady = false;
        let animationId;
        let lastDetectTime = 0;
        let detectedCorners = null; 

        // OpenCV 載入完成
        function onOpenCvReady() {
            isCvReady = true;
            statusText.innerText = "AI 引擎已就緒，請開啟相機";
            setTimeout(() => { statusText.style.display = 'none'; }, 2000);
        }

        startBtn.addEventListener('click', async () => {
            if (isCameraOn) return;
            if (!isCvReady) {
                alert("AI 引擎還在加載中，請確認網絡暢通，稍等幾秒...");
                return;
            }

            statusText.style.display = 'block';
            statusText.innerText = "正在啟動相機...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.clientWidth;
                    canvas.height = video.clientHeight;
                    processCanvas.width = 640; 
                    processCanvas.height = 480;
                    
                    startBtn.innerText = "相機已開啟";
                    captureBtn.disabled = false;
                    isCameraOn = true;
                    statusText.style.display = 'none';
                    
                    detectLoop();
                };
            } catch (err) {
                statusText.style.display = 'none';
                alert("相機啟動失敗，請確保使用 HTTPS 並允許權限");
            }
        });

        function detectLoop(timestamp) {
            if (!isCameraOn) return;

            if (timestamp - lastDetectTime > 300 && video.readyState === 4) {
                lastDetectTime = timestamp;
                detectDocumentEdge();
            }
            drawOverlay();
            requestAnimationFrame(detectLoop);
        }

        function detectDocumentEdge() {
            let src = cv.imread(processCanvas);
            let gray = new cv.Mat();
            let edges = new cv.Mat();
            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();

            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
            cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
            cv.Canny(gray, edges, 50, 150);
            let M = cv.Mat.ones(3, 3, cv.CV_8U);
            cv.dilate(edges, edges, M, new cv.Point(-1, -1), 1);
            cv.erode(edges, edges, M, new cv.Point(-1, -1), 1);
            cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0;
            let bestCorners = null;

            for (let i = 0; i < contours.size(); ++i) {
                let contour = contours.get(i);
                let area = cv.contourArea(contour);
                
                if (area > 10000) { // 稍微提高門檻，避免抓到太小的雜物
                    let peri = cv.arcLength(contour, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(contour, approx, 0.02 * peri, true);

                    if (approx.rows === 4) {
                        if (area > maxArea) {
                            maxArea = area;
                            bestCorners = [];
                            for (let j = 0; j < 4; j++) {
                                bestCorners.push({
                                    x: approx.data32S[j * 2],     
                                    y: approx.data32S[j * 2 + 1]  
                                });
                            }
                        }
                    }
                    approx.delete();
                }
            }

            if (bestCorners) {
                bestCorners.sort((a, b) => a.y - b.y); 
                let top = bestCorners.slice(0, 2).sort((a, b) => a.x - b.x);
                let bottom = bestCorners.slice(2, 4).sort((a, b) => a.x - b.x);
                let ordered = [top[0], top[1], bottom[1], bottom[0]];

                detectedCorners = ordered.map(p => ({
                    x: p.x / processCanvas.width,
                    y: p.y / processCanvas.height
                }));
            } else {
                detectedCorners = null; 
            }

            src.delete(); gray.delete(); edges.delete(); contours.delete(); hierarchy.delete(); M.delete();
        }

        function updateProcessCanvas() {
            const pCtx = processCanvas.getContext('2d');
            pCtx.drawImage(video, 0, 0, processCanvas.width, processCanvas.height);
        }

        function drawOverlay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (detectedCorners) {
                // 如果有抓到邊緣，畫跟著物體變形的黃框
                const points = detectedCorners.map(p => ({
                    x: p.x * canvas.width,
                    y: p.y * canvas.height
                }));

                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width, canvas.height);
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.lineTo(points[3].x, points[3].y);
                ctx.closePath();
                ctx.fill("evenodd");

                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                ctx.lineTo(points[1].x, points[1].y);
                ctx.lineTo(points[2].x, points[2].y);
                ctx.lineTo(points[3].x, points[3].y);
                ctx.closePath();
                ctx.stroke();

            } else {
                // 如果沒抓到，畫一個固定在中間的黃框（備用提示）
                const w = canvas.width * 0.8;
                const h = w * 1.3;
                const x = (canvas.width - w) / 2;
                const y = (canvas.height - h) / 2;

                ctx.strokeStyle = "rgba(255, 215, 0, 0.5)"; // 半透明黃，代表未鎖定
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 10]); // 虛線
                ctx.strokeRect(x, y, w, h);
                ctx.setLineDash([]); // 恢復實線
            }
        }

        setInterval(() => {
            if (isCameraOn && video.readyState === 4) {
                updateProcessCanvas();
            }
        }, 300);

        // ==========================================
        // 核心：拍照並拉直（只留框內）
        // ==========================================
        captureBtn.addEventListener('click', () => {
            if (!isCameraOn) return;

            if (!detectedCorners) {
                alert("未檢測到文件邊緣！\n請將文件放在有對比度的背景上，並讓黃框變成實線後再拍。");
                return;
            }

            photoCanvas.width = video.videoWidth;
            photoCanvas.height = video.videoHeight;
            const pCtx = photoCanvas.getContext('2d');
            pCtx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);

            try {
                let src = cv.imread(photoCanvas);
                let dst = new cv.Mat();

                let pts = detectedCorners.map(p => ({
                    x: p.x * photoCanvas.width,
                    y: p.y * photoCanvas.height
                }));

                let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    pts[0].x, pts[0].y, 
                    pts[1].x, pts[1].y, 
                    pts[2].x, pts[2].y, 
                    pts[3].x, pts[3].y
                ]);

                // 計算拉直後的長寬
                let widthA = Math.sqrt(Math.pow(pts[2].x - pts[3].x, 2) + Math.pow(pts[2].y - pts[3].y, 2));
                let widthB = Math.sqrt(Math.pow(pts[1].x - pts[0].x, 2) + Math.pow(pts[1].y - pts[0].y, 2));
                let maxWidth = Math.max(widthA, widthB);

                let heightA = Math.sqrt(Math.pow(pts[1].x - pts[3].x, 2) + Math.pow(pts[1].y - pts[3].y, 2));
                let heightB = Math.sqrt(Math.pow(pts[0].x - pts[2].x, 2) + Math.pow(pts[0].y - pts[2].y, 2));
                let maxHeight = Math.max(heightA, heightB);

                let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
                    0, 0, 
                    maxWidth - 1, 0, 
                    maxWidth - 1, maxHeight - 1, 
                    0, maxHeight - 1
                ]);

                let M = cv.getPerspectiveTransform(srcTri, dstTri);
                let dsize = new cv.Size(maxWidth, maxHeight);
                cv.warpPerspective(src, dst, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

                cv.imshow(photoCanvas, dst);

                src.delete(); dst.delete(); srcTri.delete(); dstTri.delete(); M.delete();

            } catch (error) {
                console.error("裁切失敗:", error);
            }

            document.getElementById('preview-img').src = photoCanvas.toDataURL('image/jpeg', 0.95);
            document.getElementById('preview-modal').style.display = 'flex';
        });

        document.getElementById('close-preview').addEventListener('click', () => {
            document.getElementById('preview-modal').style.display = 'none';
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'scan_' + Date.now() + '.jpg';
            link.href = document.getElementById('preview-img').src;
            link.click();
        });

    </script>
</body>
</html>
